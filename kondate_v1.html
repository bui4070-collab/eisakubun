<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1c1a2b">
<title>こんだてノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1c1a2b;--bg2:#221f35;--card:#2b2742;--card2:#352f50;--line:#433b62;
  --tx:#f4effc;--tx2:#c3badc;--tx3:#8c84ab;
  --pink:#ff9fb2;--yellow:#ffd37a;--green:#8fdcae;--blue:#8fd0ef;--olive:#d9cf8c;--lav:#b9a2ff;--orange:#ffab7a;
  --r:16px;--fs:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN','M PLUS Rounded 1c','Hiragino Sans',sans-serif;font-weight:500;
  background-image:radial-gradient(circle at 15% 8%,rgba(185,162,255,.10) 0,transparent 40%),radial-gradient(circle at 90% 30%,rgba(255,159,178,.07) 0,transparent 35%);
  min-height:100vh;overscroll-behavior-y:none}
button{font-family:inherit;color:inherit;font-size:1rem;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--tx)}
img{-webkit-user-drag:none;user-select:none}
#app{max-width:560px;margin:0 auto;padding-bottom:calc(78px + env(safe-area-inset-bottom));min-height:100vh;position:relative}

/* ===== header ===== */
.hd{position:sticky;top:0;z-index:20;padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;
  background:linear-gradient(160deg,#3b2f63 0%,#2a2348 55%,#231d3b 100%);border-bottom:1px solid rgba(255,255,255,.06);
  box-shadow:0 6px 18px rgba(0,0,0,.25);overflow:hidden}
.hd:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.7;
  background-image:radial-gradient(1.3px 1.3px at 12% 30%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 32% 70%,#ffe9a8 50%,transparent 51%),radial-gradient(1.2px 1.2px at 58% 22%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 74% 64%,#ffd3e0 50%,transparent 51%),radial-gradient(1.4px 1.4px at 88% 18%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 45% 45%,#cfc2ff 50%,transparent 51%)}
.hd-row{display:flex;align-items:center;gap:8px;position:relative}
.hd-cat{width:40px;height:40px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
.hd-title{flex:1;min-width:0}
.hd-title b{display:block;font-size:1.25rem;letter-spacing:.06em}
.hd-title small{color:var(--tx2);font-size:.85rem}
.icbtn{width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);display:grid;place-items:center;font-size:1.1rem;line-height:1}
.icbtn:active{transform:scale(.92)}
.nav{display:flex;align-items:center;gap:6px;margin-top:8px;position:relative}
.nav .lbl{flex:1;text-align:center;font-size:1.15rem;font-weight:700;letter-spacing:.04em}
.pill{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);border-radius:999px;padding:4px 10px;font-size:.92rem}

/* ===== tabs ===== */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(28,26,43,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center}
.tabs-in{display:flex;max-width:560px;width:100%}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:2px 0;color:var(--tx3);font-size:.85rem}
.tab img{width:34px;height:34px;object-fit:contain;opacity:.45;filter:grayscale(.6);transition:.25s}
.tab.on{color:var(--pink)}
.tab.on img{opacity:1;filter:none;transform:translateY(-3px) scale(1.12)}

/* ===== common ===== */
.sec{padding:10px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 4px 14px rgba(0,0,0,.18)}
.muted{color:var(--tx3)}
.h2{display:flex;align-items:center;gap:6px;font-weight:700;font-size:1.05rem;margin:14px 4px 8px}
.h2 img{width:26px;height:26px;object-fit:contain}
.btn{border:0;border-radius:999px;padding:9px 14px;font-weight:700;background:var(--card2);border:1px solid var(--line)}
.btn.pri{background:linear-gradient(135deg,#ff9fb2,#ffb98f);color:#3a1f2c;border:0;box-shadow:0 4px 12px rgba(255,159,178,.3)}
.btn.sub{background:linear-gradient(135deg,#b9a2ff,#8fd0ef);color:#1f1d3a;border:0}
.btn.sm{padding:5px 10px;font-size:.92rem}
.btn:active{transform:scale(.96)}
.seg{display:flex;gap:5px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:4px 10px;font-size:.92rem;color:var(--tx2)}
.seg button.on{background:var(--tx);color:#2a2340;border-color:var(--tx);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;background:#f4effc;color:#2a2340;
  padding:8px 14px;border-radius:999px;font-weight:700;z-index:200;transition:.25s;pointer-events:none;font-size:.95rem;box-shadow:0 6px 20px rgba(0,0,0,.35);white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* category colors */
.c1{--cc:var(--yellow)} .c2{--cc:var(--pink)} .c3{--cc:var(--green)} .c4{--cc:var(--blue)} .c5{--cc:var(--olive)}
.cu{display:inline-block;font-size:.75rem;padding:0 5px;border-radius:6px;line-height:1.5;font-weight:700;vertical-align:middle}
.cu-和{background:#ffb3b3;color:#4a1f26}.cu-洋{background:#ffd98a;color:#4a3410}.cu-中{background:#ff9c7a;color:#4a1d10}.cu-エ{background:#9fe3bf;color:#123a28}.cu-他{background:#bdb3e3;color:#2a2347}

/* ===== chips ===== */
.chip{position:relative;display:flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border-radius:999px;
  background:color-mix(in srgb,var(--cc) 16%,var(--card2));border:1px solid color-mix(in srgb,var(--cc) 55%,transparent);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;transition:transform .15s;max-width:100%}
.chip img{width:30px;height:30px;border-radius:50%;object-fit:contain;background:rgba(255,255,255,.06);flex:none}
.chip img.ph{object-fit:cover}
.chip span{font-size:1rem;line-height:1.25;color:color-mix(in srgb,var(--cc) 35%,#fff);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.chip.side img{width:24px;height:24px}
.chip.side span{font-size:.9rem}
.pressing{transform:scale(.94)!important}
.pressing:after{content:"";position:absolute;inset:-3px;border-radius:inherit;border:2px solid var(--cc,var(--pink));animation:lp .48s linear forwards;opacity:.0}
@keyframes lp{to{opacity:1;inset:-6px}}

/* ===== week ===== */
.actbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 12px 4px}
.act{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:18px;border:1px solid var(--line);text-align:left;position:relative;overflow:hidden}
.act img{width:46px;height:46px;object-fit:contain;flex:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.act b{display:block;font-size:1.05rem}
.act small{color:var(--tx2);font-size:.82rem}
.act.magic{background:linear-gradient(135deg,#4a3a7e,#33295a)}
.act.shop{background:linear-gradient(135deg,#3c4a5e,#2b3348)}
.bal{display:flex;gap:4px;flex-wrap:wrap;margin:8px 12px 0}
.bal span{font-size:.82rem;padding:2px 8px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);color:var(--tx2)}
.bal span b{color:var(--tx)}
.bal span.warn{border-color:#ff8f8f;color:#ffb3b3}
.days{display:flex;flex-direction:column;gap:7px;padding:10px 12px}
.day{display:flex;align-items:stretch;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:7px 7px 7px 6px;min-height:58px;position:relative}
.day.today{border-color:var(--pink);box-shadow:0 0 0 2px rgba(255,159,178,.18),0 4px 14px rgba(0,0,0,.2)}
.day.today:before{content:"きょう";position:absolute;top:-7px;left:10px;background:var(--pink);color:#3a1f2c;font-size:.72rem;font-weight:700;padding:0 6px;border-radius:6px}
.day.past{opacity:.62}
.dnum{width:40px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;background:var(--bg2)}
.dnum b{font-size:1.45rem;line-height:1}
.dnum span{font-size:.8rem;color:var(--tx2)}
.w0 b,.w0 span{color:#ff8fa3}.w6 b,.w6 span{color:#8fb8ff}
.dnum.hol b{color:#ff8fa3}
.dbody{flex:1;display:flex;flex-wrap:wrap;gap:5px;align-content:center;min-width:0}
.dbody .empty{color:var(--tx3);font-size:.9rem;padding-left:2px}
.dbody .note{width:100%;font-size:.78rem;color:var(--lav)}
.add{width:30px;flex:none;border:1px dashed var(--line);background:none;border-radius:12px;color:var(--tx3);font-size:1.3rem}

/* ===== calendar ===== */
.cal{margin:10px 8px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--card)}
.cal-hd,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-hd div{text-align:center;font-size:.85rem;color:var(--tx3);padding:5px 0;background:var(--bg2)}
.cell{min-height:74px;border-top:1px solid var(--line);border-left:1px solid var(--line);padding:2px;display:flex;flex-direction:column;gap:2px;min-width:0}
.cell:nth-child(7n+1){border-left:0}
.cell.out{background:rgba(0,0,0,.16)}
.cell.out .cn{opacity:.45}
.cell.today{background:rgba(255,211,122,.09)}
.cell.today .cn{background:var(--yellow);color:#3a2a0f;border-radius:999px;padding:0 5px}
.cn{font-size:.9rem;align-self:flex-start;margin-left:2px}
.mchip{font-size:.78rem;line-height:1.2;padding:2px 3px;border-radius:6px;text-align:center;word-break:break-all;
  background:color-mix(in srgb,var(--cc) 34%,var(--card2));color:color-mix(in srgb,var(--cc) 22%,#fff);border:1px solid color-mix(in srgb,var(--cc) 45%,transparent);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;position:relative;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.legend{display:flex;gap:10px;justify-content:center;font-size:.8rem;color:var(--tx2);margin:6px 0 2px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--cc);margin-right:3px;vertical-align:-1px}
.mstat{margin:6px 12px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.mstat img{width:52px;height:52px;object-fit:contain}
.bars{flex:1}
.bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--bg2);margin:4px 0}
.bar i{display:block;height:100%}
.bar-l{display:flex;gap:8px;flex-wrap:wrap;font-size:.8rem;color:var(--tx2)}

/* ===== dish list ===== */
.search{display:flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.search input{flex:1;border:0;background:none;outline:none;min-width:0;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(min-width:500px){.grid{grid-template-columns:repeat(4,1fr)}}
.dcard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 5px 7px;text-align:center;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  border-top:3px solid var(--cc)}
.dcard .pic{width:100%;aspect-ratio:1/0.82;display:grid;place-items:center;border-radius:10px;background:radial-gradient(circle at 50% 60%,rgba(255,255,255,.08),transparent 70%)}
.dcard .pic img{width:78%;height:78%;object-fit:contain;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
.dcard .pic img.ph{width:100%;height:100%;object-fit:cover;border-radius:10px;filter:none}
.dcard .nm{font-size:.92rem;line-height:1.25;margin-top:4px;min-height:2.5em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dcard .meta{font-size:.75rem;color:var(--tx3);display:flex;justify-content:center;gap:4px;align-items:center;margin-top:2px}
.dcard .new{position:absolute;top:4px;left:4px;font-size:.66rem;background:var(--lav);color:#241c45;border-radius:6px;padding:0 4px;font-weight:700}
.dcard .fav{position:absolute;top:3px;right:5px;color:var(--yellow);font-size:.9rem}
.hint{font-size:.82rem;color:var(--tx3);text-align:center;margin:8px 0}

/* ===== sheet ===== */
#sheet{position:fixed;inset:0;z-index:100;pointer-events:none}
#sheet.on{pointer-events:auto}
.sh-bg{position:absolute;inset:0;background:rgba(8,6,18,.55);opacity:0;transition:.25s}
#sheet.on .sh-bg{opacity:1}
.sh{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:88vh;overflow:auto;background:var(--bg2);border-radius:22px 22px 0 0;border:1px solid var(--line);border-bottom:0;
  padding:6px 14px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
#sheet.on .sh{transform:none}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:4px auto 8px}
.sh-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sh-h img{width:50px;height:50px;object-fit:contain}
.sh-h b{font-size:1.2rem}
.sh-h small{display:block;color:var(--tx2);font-size:.85rem}
.cur{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.cur .chip{padding-right:4px}
.x{border:0;background:rgba(255,255,255,.1);width:20px;height:20px;border-radius:50%;font-size:.85rem;line-height:20px;padding:0;flex:none;color:var(--tx2)}
.sugg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 10px}
.sg{background:linear-gradient(160deg,#3d3168,#2d2650);border:1px solid #5a4b8f;border-radius:14px;padding:6px;text-align:center}
.sg img{width:46px;height:46px;object-fit:contain}
.sg b{display:block;font-size:.92rem;line-height:1.2}
.sg small{display:block;font-size:.72rem;color:#cfc2ff;margin-top:2px;line-height:1.25}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.pk{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:5px 3px;text-align:center;border-bottom:3px solid var(--cc)}
.pk img{width:40px;height:40px;object-fit:contain}
.pk img.ph{object-fit:cover;border-radius:8px}
.pk b{display:block;font-size:.8rem;font-weight:500;line-height:1.2;max-height:2.4em;overflow:hidden}
.pk small{font-size:.68rem;color:var(--tx3)}
.newbtn{grid-column:1/-1;border:1px dashed var(--pink);background:rgba(255,159,178,.08);border-radius:12px;padding:9px;color:var(--pink);font-weight:700}
.menu-list{display:flex;flex-direction:column;gap:6px}
.menu-list button{display:flex;align-items:center;gap:10px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:1.02rem}
.menu-list button img{width:30px;height:30px;object-fit:contain}
.menu-list button.danger{color:#ff9f9f}

/* proposal */
.prow{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 8px;margin-bottom:6px}
.prow.fixed{opacity:.55}
.prow .pd{width:42px;flex:none;text-align:center;font-weight:700;line-height:1.1}
.prow .pd small{display:block;font-weight:500;font-size:.78rem}
.prow .pm{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.prow .why{font-size:.76rem;color:#cfc2ff;line-height:1.3}
.prow .rr{border:1px solid var(--line);background:var(--bg2);width:32px;height:32px;border-radius:50%;font-size:1rem;flex:none}
.tg{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 2px}
.sw{position:relative;width:44px;height:26px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.2s}
.sw i:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--green)}
.sw input:checked+i:after{left:21px}

/* ===== detail page ===== */
#detail{position:fixed;inset:0;z-index:150;background:var(--bg);overflow:auto;transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
#detail.on{transform:none}
.dt-hd{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:rgba(28,26,43,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.dt-hd b{flex:1;text-align:center;font-size:1.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{border:0;background:none;color:var(--blue);font-size:1.6rem;width:36px}
.dt{max-width:560px;margin:0 auto;padding:10px 12px 40px}
.hero{position:relative;height:190px;border-radius:20px;overflow:hidden;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 55%,color-mix(in srgb,var(--cc) 28%,transparent),transparent 65%),linear-gradient(160deg,#352c5a,#241f3d);border:1px solid var(--line)}
.hero img.il{height:150px;width:150px;object-fit:contain;filter:drop-shadow(0 8px 12px rgba(0,0,0,.4))}
.hero img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .hb{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
.hero .hb button{border:0;border-radius:999px;padding:5px 10px;background:rgba(20,16,36,.75);font-size:.88rem;backdrop-filter:blur(6px)}
.topi{display:flex;justify-content:space-between;align-items:center;margin:8px 2px}
.topi button{border:0;background:none;font-size:1.35rem}
.fld{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:8px}
.fld>label,.fld .lb{display:flex;align-items:center;gap:6px;font-size:.92rem;color:var(--tx2);margin-bottom:6px}
.fld input[type=text],.fld input[type=url],.fld textarea,.fld input[type=date]{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;outline:none}
.fld textarea{min-height:60px;resize:vertical}
.radios{display:flex;gap:4px;flex-wrap:wrap}
.radios button{display:flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:4px 9px;font-size:.95rem}
.radios button i{width:12px;height:12px;border-radius:50%;border:2px solid var(--cc,var(--tx2))}
.radios button.on{background:color-mix(in srgb,var(--cc,var(--lav)) 22%,var(--card2));border-color:var(--cc,var(--lav))}
.radios button.on i{background:var(--cc,var(--lav))}
.icons{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.icons::-webkit-scrollbar{display:none}
.icons button{flex:none;width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);padding:3px}
.icons button img{width:100%;height:100%;object-fit:contain}
.icons button.on{border:2px solid var(--pink);background:rgba(255,159,178,.12)}
.ings{display:flex;flex-wrap:wrap;gap:5px;min-height:30px}
.ing{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:3px 4px 3px 10px;font-size:.98rem;user-select:none}
.ing.mainI{border-color:rgba(143,220,174,.6);background:rgba(143,220,174,.1)}
.ing.panI{border-color:rgba(185,162,255,.45);background:rgba(185,162,255,.08);color:var(--tx2)}
.ing-add{display:flex;gap:6px;margin-top:7px}
.ing-add input{flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;outline:none;min-width:0}
.ing-add button{border:0;border-radius:999px;padding:0 12px;background:var(--card2);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;text-align:center}
.stats b{display:block;font-size:1.25rem}
.stats small{font-size:.75rem;color:var(--tx3)}
.lightbox{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.9);display:grid;place-items:center}
.lightbox img{max-width:96vw;max-height:90vh;border-radius:12px}

/* ===== shopping ===== */
.shop-hero{display:flex;align-items:center;gap:10px;margin:10px 12px 0;padding:10px 12px;background:linear-gradient(135deg,#3c4a5e,#2b2f4b)}
.shop-hero img{width:64px;height:64px;object-fit:contain}
.range{display:flex;align-items:center;gap:6px;margin-top:6px}
.range input{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:4px 6px;font-size:14px;width:100%;min-width:0}
.banner{margin:8px 12px 0;padding:8px 12px;border-radius:14px;background:rgba(255,211,122,.12);border:1px solid rgba(255,211,122,.4);display:flex;align-items:center;gap:8px;font-size:.92rem}
.banner span{flex:1}
.grp{margin:10px 12px 0}
.grp-h{display:flex;align-items:center;gap:6px;font-size:.92rem;color:var(--tx2);margin:0 4px 5px;font-weight:700}
.grp-h i{font-style:normal;font-size:1rem}
.it{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--tx3);flex:none;display:grid;place-items:center;font-size:.8rem;color:transparent;background:none;padding:0}
.it.done .ck{background:var(--green);border-color:var(--green);color:#173726}
.it .nm{flex:1;min-width:0}
.it .nm b{font-weight:500;font-size:1.05rem}
.it .nm small{display:block;font-size:.75rem;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it.done .nm b{text-decoration:line-through;color:var(--tx3)}
.cnt{font-size:.78rem;background:var(--card2);border-radius:999px;padding:1px 7px;color:var(--tx2)}
.addrow{display:flex;gap:6px;margin:10px 12px 0}
.addrow input{flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:8px 14px;outline:none;min-width:0}
details.pan{margin:10px 12px 0}
details.pan summary{list-style:none;cursor:pointer;padding:10px 12px;font-size:.95rem;color:var(--tx2)}
details.pan summary::-webkit-details-marker{display:none}
.pan-list{display:flex;flex-wrap:wrap;gap:5px;padding:0 12px 12px}
.pan-list button{border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:3px 10px;font-size:.92rem;color:var(--tx2)}
.empty-st{text-align:center;padding:24px 10px;color:var(--tx2)}
.empty-st img{width:110px;height:110px;object-fit:contain;opacity:.95}

/* ===== settings ===== */
.set-g{margin:8px 12px 0}
.set-g .t{font-size:.88rem;color:var(--tx3);margin:12px 6px 5px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:1.02rem}
.row:last-child{border-bottom:0}
.row select{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:4px 8px;font-size:14px}
.months{display:flex;flex-wrap:wrap;gap:4px;padding:0 12px 10px}
.months button{width:38px;border:1px solid var(--line);background:var(--bg2);border-radius:10px;padding:4px 0;font-size:.9rem;color:var(--tx2)}
.months button.on{background:rgba(143,208,239,.2);border-color:var(--blue);color:#fff}
.foot{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--tx3);font-size:.8rem;margin:18px 0}
.foot img{width:40px}
.mi{width:20px;height:20px;object-fit:contain;vertical-align:-5px;flex:none}
.mi2{width:24px;height:24px;object-fit:contain}
.mi3{width:26px;height:26px;object-fit:contain}
.rr{display:grid;place-items:center;padding:0}
.delb{font-size:.9rem!important;color:#ff9f9f;border:1px solid rgba(255,159,159,.4)!important;border-radius:999px;padding:3px 12px}
</style>
</head>

        const r = pickBest(k,plans,st,{filter:d=>d.tags.includes('鍋')}); if(r){ assign(k,r); break; } }
    }
    // ② カレー枠（週1・火水木を優先、平日のみ）
    if(!has('カ')){
      for(const p of [2,3,4,1,5]){ const k = ks.find(x=>pk(x).getDay()===p && !out[x]); if(!k) continue;
        const r = pickBest(k,plans,st,{filter:d=>d.tags.includes('カ')}); if(r){ assign(k,r); break; } }
    }
  }
  // ③ 残りを順番にバランスよく
  targets.slice().sort().forEach(k => { if(!out[k]){ const r = pickBest(k,plans,st); if(r) assign(k,r); } });
  // ④ 副菜・汁物
  if(S.set.sideSuggest) Object.keys(out).forEach(k => { const sd = pickSide(k, D(out[k].id), plans); if(sd){ out[k].side = sd.id; plans[k].push(sd.id); } });
  return out;
}

function planHash(from,to){ return JSON.stringify(rangeKeys(from,to).map(k=>S.plans[k]||[])); }
function genShop(from,to){
  const main={}, pan={};
  rangeKeys(from,to).forEach(k=>(S.plans[k]||[]).forEach(id=>{ const d=D(id); if(!d) return;
    d.main.forEach(n=>(main[n]=main[n]||[]).push(d.name)); d.pantry.forEach(n=>(pan[n]=pan[n]||[]).push(d.name)); }));
  return {main,pan};
}
function refreshShop(reset){
  const sh=S.shop; if(reset) sh.removed=[];
  const {main} = genShop(sh.from, sh.to); const old={}; sh.items.forEach(i=>old[i.name]=i);
  const items=[];
  for(const n in main){ if(sh.removed.includes(n)) continue; items.push({name:n, src:main[n], checked:!reset && !!(old[n]&&old[n].checked), manual:!!(old[n]&&old[n].manual)}); }
  sh.items.filter(i=>i.manual && !main[i.name]).forEach(i=>items.push(i));
  sh.items=items; sh.hash=planHash(sh.from,sh.to); save();
}

function fillDayGrid(){
  const st=stats(); const q=ds.q.trim();

  arr.sort((a,b)=>(b.fav-a.fav)||((st.freq[b.id]||0)-(st.freq[a.id]||0)));
  let h = arr.slice(0,80).map(d=>`<div class="pk ${CC[d.cat]}" data-act="pickDish" data-id="${d.id}">${imgTag(d)}<b>${esc(d.name)}</b><small>${st.freq[d.id]?st.freq[d.id]+'回':'NEW'}</small></div>`).join('');

function guessIcon(n, cat){
  const r=[[/ラーメン|中華そば|担々麺|冷やし中華/,'ramen'],[/うどん|そば|そうめん/,'udon'],[/パスタ|スパゲ|ナポリ|カルボ|ペペ|ボロネ/,'pasta'],[/カレー|ハヤシ/,'curry'],[/鍋|しゃぶ/,'nabe'],
    [/揚|フライ|カツ|天|唐揚|から揚|コロッケ/,'fried'],[/丼|ライス/,'don'],[/炒|麻婆|餃子|チャーハン|酢豚|チリ|八宝/,'chuka'],[/鮭|ブリ|ぶり|魚|サバ|さば|アジ|マグロ|刺身|さんま/,'fish'],
    [/グラタン|ドリア|シチュー/,'gratin'],[/お好み|焼きそば|たこ焼/,'okonomi'],[/オム/,'omu'],[/汁|スープ/,'soup'],[/サラダ|和え|おひたし|きんぴら|ナムル/,'side'],[/煮/,'nimono'],[/ハンバーグ|チキン|焼肉|ステーキ|生姜焼|ソテー/,'meat']];
  for(const [re,ic] of r) if(re.test(n)) return ic;
  return {副菜:'side',汁物:'soup',その他:'other'}[cat] || 'meat';
}
function guessCui(n){ if(/パスタ|グラタン|シチュー|ハンバーグ|オム|ドリア|スープ|ソテー|ムニエル|ピザ/.test(n)) return '洋'; if(/麻婆|炒|餃子|チャーハン|中華|ラーメン|酢豚|チリ/.test(n)) return '中'; if(/ガパオ|キムチ|タコ|ナシ|フォー|ビビンバ|トムヤム/.test(n)) return 'エ'; return '和'; }
function createDish(name, cat){
  const id='d'+(S.seq++);
  S.dishes[id] = { id, name, cat, cui:guessCui(name), icon:guessIcon(name,cat), prot:'なし', tags:/鍋/.test(name)?['鍋','冬']:/カレー/.test(name)?['カ']:[], isNew:false, main:[], pantry:[], url:'', memo:'', photo:'', fav:false };
  return id;
}

// ================= おまかせ提案シート =================
let P = null;
function proposeKeys(mode){
  const t=today();
  if(mode==='sat') return rangeKeys(dk(t), dk(nextSat(t)));
  if(mode==='week'){ const s=wkStart(cur); return rangeKeys(dk(s), dk(addD(s,6))); }
  if(mode==='next'){ const s=addD(wkStart(cur),7); return rangeKeys(dk(s), dk(addD(s,6))); }
}
function openPropose(mode){
  mode = mode || (P && P.mode) || 'sat';
  const keys = proposeKeys(mode); const ow = P ? P.ow : false;
  P = { mode, keys, ow, rows: planRange(keys, ow) };
  drawPropose();
}
function drawPropose(){
  const t=TK();
  const rows = P.keys.map(k=>{
    const d=pk(k), w=d.getDay(); const r=P.rows[k];
    const col = w===0?'#ff8fa3':w===6?'#8fb8ff':'';
    if(r){ const x=D(r.id), sd=r.side?D(r.side):null;
      return `<div class="prow"><div class="pd" style="color:${col}">${d.getDate()}<small>${WD[w]}</small></div><div class="pm"><div style="display:flex;gap:4px;flex-wrap:wrap">${chip(x,'','')}${sd?chip(sd,'',''):''}</div><div class="why">${esc(r.why.join(' / ')||CUL[x.cui])}</div></div>
        <button class="rr" data-act="pReroll" data-k="${k}">${ico('magic','mi2')}</button><button class="x" data-act="pDel" data-k="${k}">×</button></div>`; }
    const ex=(S.plans[k]||[]).map(D).filter(Boolean);
    return `<div class="prow fixed"><div class="pd" style="color:${col}">${d.getDate()}<small>${WD[w]}</small></div><div class="pm"><div style="font-size:.95rem">${ex.length?esc(ex.map(x=>x.name).join('・')):'（空き）'}</div><div class="why" style="color:var(--tx3)">${k<t?'過ぎた日':ex.length?'決まっています':'お休み'}</div></div>
      ${k>=t?`<button class="rr" data-act="pReroll" data-k="${k}">${ico('magic','mi2')}</button>`:''}</div>`;
  }).join('');
  const merged = JSON.parse(JSON.stringify(S.plans)); for(const k in P.rows){ merged[k] = (P.ow||P.rows[k].replace) ? [P.rows[k].id] : [...(merged[k]||[]), P.rows[k].id]; }
  const keep=S.plans; S.plans=merged; const bal=balanceHTML(P.keys); S.plans=keep;
  openSheet(`<div class="sh-h"><img src="${IMG.magic}" alt=""><div><b>おまかせ献立</b><small>これまでの傾向から和洋中・揚げ物・お肉のバランスを考えて提案</small></div></div>
    <div class="seg">${[['sat','今日〜次の土曜'],['week','表示中の週'],['next','その次の週']].map(([v,l])=>`<button class="${P.mode===v?'on':''}" data-act="pMode" data-v="${v}">${l}</button>`).join('')}</div>
    <div class="tg"><span>決まっている日も作り直す</span><label class="sw"><input type="checkbox" id="pOw" ${P.ow?'checked':''}><i></i></label></div>
    ${rows}<div style="margin:2px -12px 8px">${bal}</div>
    <div style="display:flex;gap:8px"><button class="btn" style="flex:1" data-act="pAll">${ico('magic')} 全部ふり直す</button><button class="btn pri" style="flex:1.4" data-act="pApply">この献立で決定</button></div>`);
  $('#pOw').onchange = e=>{ P.ow=e.target.checked; P.rows=planRange(P.keys,P.ow); drawPropose(); };
}
function tempPlans(exceptK){
  const pl = JSON.parse(JSON.stringify(S.plans));
  for(const k in P.rows){ if(k===exceptK) continue; pl[k] = (P.ow||P.rows[k].replace) ? [P.rows[k].id] : [...(pl[k]||[]), P.rows[k].id]; if(P.rows[k].side) pl[k].push(P.rows[k].side); }
  if(P.ow || !P.rows[exceptK]) pl[exceptK] = P.ow ? [] : (pl[exceptK]||[]).filter(id=>!isMainCat(D(id)));
  return pl;
}

let reopenDay=null;
function resizeImage(file, max=640){
  return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>{ const im=new Image(); im.onload=()=>{ const s=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s); c.getContext('2d').drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',.72)); }; im.onerror=rej; im.src=fr.result; }; fr.onerror=rej; fr.readAsDataURL(file); });
}

// ================= アクション =================
function act(a, ds0={}, el){
  const v = ds0.v;
  switch(a){
    case 'tab': tab=v; window.scrollTo(0,0); render(); break;
    case 'wkPrev': cur=addD(cur,-7); render(); break;
    case 'wkNext': cur=addD(cur,7); render(); break;
    case 'wkToday': cur=today(); render(); break;
    case 'calPrev': calCur=new Date(calCur.getFullYear(),calCur.getMonth()-1,1); render(); break;
    case 'calNext': calCur=new Date(calCur.getFullYear(),calCur.getMonth()+1,1); render(); break;
    case 'calToday': calCur=new Date(today().getFullYear(),today().getMonth(),1); render(); break;
    case 'daySheet': openDay(ds0.day); break;
    case 'daySheetFromMenu': closeSheet(); setTimeout(()=>openDay(ds0.day),280); break;
    case 'closeSheet': closeSheet(); render(); break;
    case 'dsCat': ds.cat=v; document.querySelectorAll('#dsSeg button').forEach(b=>b.classList.toggle('on',b.dataset.v===v)); fillDayGrid(); break;
    case 'pickDish': { (S.plans[ds.k]=S.plans[ds.k]||[]).push(ds0.id); save(); fillDayCur(); render(); toast(`${D(ds0.id).name} を追加しました`); break; }
    case 'createDish': { const name=ds.q.trim(); if(!name) break; const id=createDish(name, CATS.includes(ds.cat)?ds.cat:'主菜'); (S.plans[ds.k]=S.plans[ds.k]||[]).push(id); save(); ds.q=''; $('#dsq').value=''; fillDayCur(); fillDayGrid(); render(); toast('登録しました（長押しで食材を追加できます）'); break; }
    case 'rmPlan': { const arr=S.plans[ds0.k]||[]; arr.splice(+ds0.i,1); if(!arr.length) delete S.plans[ds0.k]; save(); fillDayCur(); render(); break; }
    case 'rmPlanMenu': { const arr=S.plans[ds0.k]||[]; arr.splice(+ds0.i,1); if(!arr.length) delete S.plans[ds0.k]; save(); closeSheet(); render(); break; }
    case 'reroll': { const k=ds0.k, i=+ds0.i; const arr=S.plans[k]; const old=arr[i]; const pl=JSON.parse(JSON.stringify(S.plans)); pl[k].splice(i,1);
      const r=pickBest(k,pl,stats(),{exclude:[old]}); if(r){ arr[i]=r.d.id; save(); closeSheet(); render(); toast(`${r.d.name} に入れ替えました`); } else toast('候補が見つかりませんでした'); break; }
    case 'openDetail': openDetail(ds0.id); break;
    case 'propose': P=null; openPropose('sat'); break;
    case 'pMode': openPropose(v); break;
    case 'pAll': P.rows=planRange(P.keys,P.ow); drawPropose(); break;
    case 'pReroll': { const k=ds0.k; const pl=tempPlans(k); const ex=P.rows[k]?[P.rows[k].id]:[]; const r=pickBest(k,pl,stats(),{exclude:ex});
      if(r){ P.rows[k]={id:r.d.id, why:r.R.slice(0,2), replace:mains(k).length>0}; if(S.set.sideSuggest){ const sd=pickSide(k,r.d,pl); if(sd) P.rows[k].side=sd.id; } drawPropose(); } else toast('候補が見つかりませんでした'); break; }
    case 'pDel': delete P.rows[ds0.k]; drawPropose(); break;
    case 'pApply': { let n=0; for(const k in P.rows){ const r=P.rows[k]; const add=[r.id]; if(r.side) add.push(r.side); S.plans[k] = (P.ow||r.replace) ? [...(S.plans[k]||[]).filter(id=>!isMainCat(D(id))), ...add] : [...(S.plans[k]||[]), ...add]; n++; }
      save(); closeSheet(); render(); P=null; toast(n?`${n}日分の献立を入れました`:'変更はありません');
      if(n) setTimeout(()=>openSheet(`<div class="sh-h"><img src="${IMG.basket}"><div><b>買い物リストも作りますか？</b><small>${md(today())}〜${md(nextSat(today()))}の献立からメイン食材をまとめます</small></div></div><div style="display:flex;gap:8px"><button class="btn" style="flex:1" data-act="closeSheet">あとで</button><button class="btn pri" style="flex:1.4" data-act="shopFromPropose">作成する</button></div>`),350);
      break; }
    case 'shopFromPropose': closeSheet(); S.shop.from=TK(); S.shop.to=dk(nextSat(today())); refreshShop(true); tab='shop'; render(); break;
    case 'goShop': tab='shop'; render(); break;
    case 'rng': { let a1,b1; const t=today();
      if(v==='sat'){ a1=t; b1=nextSat(t); } if(v==='week'){ a1=wkStart(cur); b1=addD(a1,6); } if(v==='next'){ a1=addD(wkStart(cur),7); b1=addD(a1,6); }
      S.shop.from=dk(a1); S.shop.to=dk(b1); refreshShop(true); render(); break; }
    case 'shopUpd': refreshShop(false); render(); toast('最新の献立で更新しました'); break;
    case 'shopReset': refreshShop(true); render(); toast('提案し直しました'); break;
    case 'ck': { const it=S.shop.items[+ds0.i]; it.checked=!it.checked; save(); render(); break; }
    case 'rmItem': { const it=S.shop.items.splice(+ds0.i,1)[0]; if(!it.manual) S.shop.removed.push(it.name); save(); render(); break; }
    case 'addItem': { const el2=$('#addItem'); const vals=el2.value.split(/[、,，\s]+/).map(x=>x.trim()).filter(Boolean); vals.forEach(n=>{ if(!S.shop.items.some(i=>i.name===n)) S.shop.items.push({name:n,src:[],checked:false,manual:true}); S.shop.removed=S.shop.removed.filter(x=>x!==n); }); save(); render(); setTimeout(()=>$('#addItem')&&$('#addItem').focus(),0); break; }
    case 'addPan': { const n=ds0.n; const {pan}=genShop(S.shop.from,S.shop.to); S.shop.items.push({name:n,src:pan[n]||[],checked:false,manual:true}); save(); render(); toast(`${n} を追加しました`); break; }
    case 'clearDone': S.shop.items.filter(i=>i.checked&&!i.manual).forEach(i=>S.shop.removed.push(i.name)); S.shop.items=S.shop.items.filter(i=>!i.checked); save(); render(); break;
    case 'shopCopy': { const g={}; S.shop.items.filter(i=>!i.checked).forEach(i=>(g[secOf(i.name)]=g[secOf(i.name)]||[]).push(i.name));
      let txt=`【買い物リスト ${md(pk(S.shop.from))}〜${md(pk(S.shop.to))}】\n`; for(const k of ['veg','meat','fish','egg','tofu','noodle','can','other']) if(g[k]) txt+=`\n■${SECL[k].split('|')[1]}\n`+g[k].map(x=>'・'+x).join('\n')+'\n';
      shareText(txt); break; }
    case 'shareWeek': { const s=wkStart(cur); let txt=`【今週の献立 ${md(s)}〜${md(addD(s,6))}】\n`; for(let i=0;i<7;i++){ const d=addD(s,i); txt+=`${mdw(d)} ${(S.plans[dk(d)]||[]).map(id=>D(id)?.name).filter(Boolean).join('・')||'—'}\n`; } shareText(txt); break; }
    // 一覧
    case 'dlCat': dl.cat=v; render(); break;
    case 'dlCu': dl.cu=v; render(); break;
    case 'newDish': openDetail(null); break;
    // 詳細
    case 'closeDetail': closeDetail(); break;
    case 'dCat': syncDraft(); DR.cat=v; redrawDetail(); break;
    case 'dCui': syncDraft(); DR.cui=v; redrawDetail(); break;
    case 'dIcon': DR.icon=v; redrawDetail(); break;
    case 'dProt': DR.prot=v; redrawDetail(); break;
    case 'dTag': DR.tags = DR.tags.includes(v)?DR.tags.filter(x=>x!==v):[...DR.tags,v]; redrawDetail(); break;
    case 'favT': DR.fav=!DR.fav; redrawDetail(); break;
    case 'mvIng': { const g=ds0.g, i=+ds0.i; const x=DR[g].splice(i,1)[0]; DR[g==='main'?'pantry':'main'].push(x); redrawDetail(); break; }
    case 'rmIng': DR[ds0.g].splice(+ds0.i,1); redrawDetail(); break;
    case 'addIng': { const inp=$(ds0.g==='main'?'#inMain':'#inPan'); const vals=inp.value.split(/[、,，]+/).map(x=>x.trim()).filter(Boolean);
      vals.forEach(x=>{ if(DR.main.includes(x)||DR.pantry.includes(x)) return; DR[ds0.g].push(x); }); redrawDetail(); setTimeout(()=>{ const n=$(ds0.g==='main'?'#inMain':'#inPan'); n&&n.focus(); },0); break; }
    case 'pasteUrl': navigator.clipboard?.readText().then(t=>{ $('#dUrl').value=t; }).catch(()=>toast('ペーストできませんでした')); break;
    case 'addPhoto': $('#photoIn').click(); break;
    case 'rmPhoto': DR.photo=''; redrawDetail(); break;
    case 'zoom': { const lb=document.createElement('div'); lb.className='lightbox'; lb.innerHTML=`<img src="${DR.photo}">`; lb.onclick=()=>lb.remove(); document.body.appendChild(lb); break; }
    case 'saveDetail': { syncDraft(); if(!DR.name){ toast('料理名を入力してください'); break; }
      const dup = liveDishes().find(x=>x.name===DR.name && x.id!==DR.id); if(dup){ toast('同じ名前の料理があります'); break; }
      if(!DR.id){ DR.id='d'+(S.seq++); }
      S.dishes[DR.id]=JSON.parse(JSON.stringify(DR)); save(); toast('保存しました'); closeDetail(); break; }
    case 'delDish': { if(!confirm(`「${DR.name}」を削除しますか？`)) break; const id=DR.id;
      if(S.set.delFromPlan){ for(const k in S.plans){ S.plans[k]=S.plans[k].filter(x=>x!==id); if(!S.plans[k].length) delete S.plans[k]; } delete S.dishes[id]; }
      else { const used=Object.values(S.plans).some(a=>a.includes(id)); if(used) S.dishes[id].hidden=true; else delete S.dishes[id]; }
      save(); toast('削除しました'); closeDetail(); break; }
    // 設定
    case 'nabeM': { const m=+v; const a2=S.set.nabeMonths; S.set.nabeMonths = a2.includes(m)?a2.filter(x=>x!==m):[...a2,m]; save(); render(); break; }
    case 'rmPantry': S.set.pantry.splice(+ds0.i,1); save(); render(); break;
    case 'addPantry': { const vals=$('#addPantry').value.split(/[、,，\s]+/).filter(Boolean); vals.forEach(x=>{ if(!S.set.pantry.includes(x)) S.set.pantry.push(x); }); save(); render(); break; }
    case 'export': { const b=new Blob([JSON.stringify(S)],{type:'application/json'}); const a3=document.createElement('a'); a3.href=URL.createObjectURL(b); a3.download=`kondate_backup_${TK()}.json`; a3.click(); toast('書き出しました'); break; }
    case 'import': $('#importIn').click(); break;
    case 'resetAll': if(confirm('すべてのデータを初期状態に戻しますか？（写真や追加した料理も消えます）')){ S=initState(); save(); render(); toast('初期データに戻しました'); } break;
  }
}
function shareText(txt){
  if(navigator.share){ navigator.share({text:txt}).catch(()=>{}); return; }
  navigator.clipboard?.writeText(txt).then(()=>toast('コピーしました')).catch(()=>{ prompt('コピーしてください',txt); });
}
// 新しい食材の自動分類（詳細画面で追加したとき、常備品リストにあれば調味料側へ）

// ================= イベント =================
let lp = { t:null, fired:false, x:0, y:0, el:null };
function lpClear(){ clearTimeout(lp.t); lp.t=null; if(lp.el) lp.el.classList.remove('pressing'); lp.el=null; }
document.addEventListener('pointerdown', e=>{
  const el = e.target.closest('[data-id]'); if(!el || e.target.closest('.x') || el.closest('.prow')) return;
  if($('#detail').classList.contains('on')) return;
  lp.fired=false; lp.x=e.clientX; lp.y=e.clientY; lp.el=el; el.classList.add('pressing');
  lp.t = setTimeout(()=>{ lp.fired=true; const id=el.dataset.id; lpClear(); navigator.vibrate && navigator.vibrate(15);
    if(sheetOpen() && ds.k && $('#dsCur')) reopenDay = ds.k;
    openDetail(id); }, 480);
});
document.addEventListener('pointermove', e=>{ if(lp.t && Math.hypot(e.clientX-lp.x, e.clientY-lp.y)>10) lpClear(); });
document.addEventListener('pointerup', lpClear); document.addEventListener('pointercancel', lpClear);
document.addEventListener('contextmenu', e=>{ if(e.target.closest('[data-id]')) e.preventDefault(); });
document.addEventListener('click', e=>{
  if(lp.fired){ e.preventDefault(); e.stopPropagation(); lp.fired=false; return; }
  const a = e.target.closest('[data-act]');
  const chipEl = e.target.closest('[data-id]');
  // 料理チップのタップ
  if(chipEl && !(a && chipEl.contains(a) && a!==chipEl && a.dataset.act!=='daySheet')){
    if(chipEl.dataset.open){ openDetail(chipEl.dataset.id); return; }
    if(chipEl.classList.contains('pk') || chipEl.classList.contains('sg')){ /* falls through to data-act pickDish */ }
    else if(chipEl.dataset.k && !e.target.closest('#dsCur')){ e.stopPropagation(); chipMenu(chipEl.dataset.id, chipEl.dataset.k, chipEl.dataset.i); return; }
    else if(e.target.closest('#dsCur') && !a){ return; }
  }
  if(!a) return;
  if(a.dataset.act==='daySheet' && e.target.closest('[data-id]')) return;
  act(a.dataset.act, a.dataset, a);
}, true);
$('#photoIn').onchange = async e=>{ const f=e.target.files[0]; if(!f||!DR) return; try{ syncDraft(); DR.photo = await resizeImage(f); redrawDetail(); }catch(err){ toast('画像を読み込めませんでした'); } e.target.value=''; };
$('#importIn').onchange = e=>{ const f=e.target.files[0]; if(!f) return; const fr=new FileReader(); fr.onload=()=>{ try{ const o=JSON.parse(fr.result); if(!o.dishes||!o.plans) throw 0; S=o; save(); render(); toast('読み込みました'); }catch(err){ toast('ファイルを読み込めませんでした'); } }; fr.readAsText(f); e.target.value=''; };
// スワイプ
let sw0=null;
document.addEventListener('touchstart', e=>{ if(sheetOpen()||$('#detail').classList.contains('on')) return; const t=e.touches[0]; sw0={x:t.clientX,y:t.clientY,tm:Date.now()}; }, {passive:true});
document.addEventListener('touchend', e=>{ if(!sw0||!S.set.swipe) return; const t=e.changedTouches[0]; const dx=t.clientX-sw0.x, dy=t.clientY-sw0.y; const ok=Math.abs(dx)>70 && Math.abs(dy)<45 && Date.now()-sw0.tm<600; sw0=null; if(!ok) return;
  if(tab==='week') act(dx<0?'wkNext':'wkPrev'); if(tab==='cal') act(dx<0?'calNext':'calPrev'); }, {passive:true});

// 詳細で食材追加時、常備品リストの物は自動で調味料側へ
const _origAct = act;
act = function(a, d0={}, el){
  if(a==='addIng' && DR){
    const inp=$(d0.g==='main'?'#inMain':'#inPan'); const vals=inp.value.split(/[、,，]+/).map(x=>x.trim()).filter(Boolean);
    vals.forEach(x=>{ if(DR.main.includes(x)||DR.pantry.includes(x)) return; const g = d0.g==='main' && S.set.pantry.includes(x) ? 'pantry' : d0.g; DR[g].push(x); if(g!==d0.g) toast(`${x} は常備品なので調味料側に入れました`); });
    redrawDetail(); setTimeout(()=>{ const n=$(d0.g==='main'?'#inMain':'#inPan'); n&&n.focus(); },0); return;
  }
  return _origAct(a,d0,el);
};

load(); render();

</script>
